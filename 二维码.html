<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码生成与解析工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        .glass-effect {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .border-success {
            border-color: #10b981 !important;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">

        <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">二维码生成与解析工具</h1>

        <!-- 生成二维码 -->
        <div class="glass-effect rounded-2xl shadow-xl p-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">
                <i class="fa fa-qrcode text-indigo-500 mr-2"></i>生成二维码
            </h2>
            <textarea id="qr-text" rows="3"
                class="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-indigo-400 focus:outline-none transition-all"
                placeholder="输入文字或网址..."></textarea>
            <div class="flex gap-3 mt-4">
                <button onclick="generateQRCode()"
                    class="flex-1 bg-indigo-500 hover:bg-indigo-600 text-white font-medium py-3 rounded-xl transition-all">
                    <i class="fa fa-magic mr-2"></i>生成二维码
                </button>
                <button onclick="clearGenerate()"
                    class="px-6 bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-3 rounded-xl transition-all">
                    清空
                </button>
            </div>
            <div id="qr-result" class="mt-4 text-center hidden">
                <img id="qr-image" src="" alt="二维码" class="mx-auto rounded-xl shadow-md">
                <p class="text-sm text-gray-500 mt-2">长按或右键保存图片</p>
            </div>
        </div>

        <!-- 解析二维码 -->
        <div class="glass-effect rounded-2xl shadow-xl p-6">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">
                <i class="fa fa-search text-indigo-500 mr-2"></i>解析二维码
            </h2>

            <div id="upload-area" onclick="document.getElementById('qr-file').click()"
                class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center transition-all hover:border-indigo-400 cursor-pointer">
                <i class="fa fa-cloud-upload text-4xl text-gray-400 mb-4"></i>
                <p class="text-gray-600 mb-2">点击或拖拽文件到此处上传</p>
                <p class="text-sm text-gray-500">支持 JPG、PNG、WEBP 格式</p>
            </div>

            <input type="file" id="qr-file" accept="image/*" class="hidden">

            <div id="decode-result" class="mt-4 hidden">
                <div class="bg-gray-50 rounded-xl p-4">
                    <p class="text-sm text-gray-500 mb-2">识别结果：</p>
                    <p id="decode-text" class="text-gray-800 break-all"></p>
                </div>
                <button onclick="copyDecodeResult()"
                    class="mt-3 w-full bg-indigo-500 hover:bg-indigo-600 text-white font-medium py-3 rounded-xl transition-all">
                    <i class="fa fa-copy mr-2"></i>复制结果
                </button>
            </div>
        </div>

    </div>

    <script>
    // ========== 生成二维码 ==========
    function generateQRCode() {
        const text = document.getElementById('qr-text').value.trim();
        if (!text) {
            alert('请先输入内容');
            return;
        }
        // 统一使用 HTTPS 接口，避免 GitHub Pages 混合内容拦截
        const url = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='
            + encodeURIComponent(text);

        const img = document.getElementById('qr-image');
        img.src = url;
        img.onload = function () {
            document.getElementById('qr-result').classList.remove('hidden');
        };
        img.onerror = function () {
            alert('二维码生成失败，请检查网络后重试');
        };
    }

    function clearGenerate() {
        document.getElementById('qr-text').value = '';
        document.getElementById('qr-result').classList.add('hidden');
        document.getElementById('qr-image').src = '';
    }

    // ========== 解析二维码 ==========
    const fileInput = document.getElementById('qr-file');

    fileInput.addEventListener('change', function (e) {
        const file = e.target.files[0];
        if (!file) return;

        // 上传区高亮：用 id 定位，避免 .border 选择器取到 null 报错
        const uploadArea = document.getElementById('upload-area');
        if (uploadArea) {
            uploadArea.classList.add('border-success');
            uploadArea.classList.remove('border-gray-300', 'hover:border-indigo-400');
        }

        decodeQRCode(file);
    });

    function decodeQRCode(file) {
        const reader = new FileReader();
        reader.onload = function (event) {
            const img = new Image();
            img.onload = function () {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);

                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                if (typeof jsQR === 'undefined') {
                    alert('解析库未加载，请检查网络后重试');
                    return;
                }
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code) {
                    document.getElementById('decode-text').textContent = code.data;
                    document.getElementById('decode-result').classList.remove('hidden');
                } else {
                    alert('未能识别出二维码，请换一张更清晰的图片');
                }
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    function copyDecodeResult() {
        const text = document.getElementById('decode-text').textContent;
        navigator.clipboard.writeText(text).then(function () {
            alert('已复制到剪贴板');
        }).catch(function () {
            alert('复制失败，请手动选择文本复制');
        });
    }

    // ========== 拖拽上传 ==========
    const uploadArea = document.getElementById('upload-area');
    uploadArea.addEventListener('dragover', function (e) {
        e.preventDefault();
        uploadArea.classList.add('border-success');
    });
    uploadArea.addEventListener('dragleave', function () {
        uploadArea.classList.remove('border-success');
    });
    uploadArea.addEventListener('drop', function (e) {
        e.preventDefault();
        uploadArea.classList.remove('border-success');
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) {
            decodeQRCode(file);
        }
    });
    </script>
</body>
</html>
